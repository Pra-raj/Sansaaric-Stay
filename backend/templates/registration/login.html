{% extends "base.html" %}
{% block title %}Login · RAG Chat{% endblock %}
{% block content %}
<div class="login-card">
  <div class="panel">
    <h1>Sign in</h1>
    {% if form.errors %}
      <div class="errors">Your username and password didn't match. Please try again.</div>
    {% endif %}
    <form method="post" action="{% url 'login' %}" style="margin-top:14px;">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <label for="id_username">Username</label>
      <input type="text" name="username" autofocus autocapitalize="none" autocomplete="username" required id="id_username" style="margin-bottom:12px;">
      <label for="id_password">Password</label>
      <input type="password" name="password" autocomplete="current-password" required id="id_password" style="margin-bottom:16px;">
      <button type="submit" class="primary" style="width:100%;">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
